name: Release

# Release pipeline: build -> publish -> refresh-context, chained so each stage gates the next.
# Push a semver tag X.Y.Z (must equal pubspec.yaml `version:`; pub.dev tag pattern '{{version}}').
# pub.dev OIDC only trusts tag-triggered runs, so there is no manual dispatch.
#
#   build            reuses build.yml (format + analyze incl. example/ + tests) — a tag on a broken
#                    commit never publishes.
#   publish          needs build. OIDC publish to pub.dev via the dart-lang reusable workflow
#                    (id-token: write, no token/secret). See RELEASING.md for the one-time setup.
#   refresh-context  needs publish. Re-indexes Context7 only after the package is live.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # e.g. 0.1.0 — matches pub.dev pattern '{{version}}'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    permissions:
      id-token: write # Required for OIDC authentication with pub.dev.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev

  refresh-context:
    needs: publish
    uses: ./.github/workflows/context7-refresh.yml
    secrets: inherit
