name: Pull contract updates

# Fires the shared contract-sync workflow (tiducto/.github) with this repo's specifics. See that
# workflow for the actual logic — this file only owns the triggers and the add-paths.
#
# Requires a CONTRACT_REPO_TOKEN secret (read access to tiducto/spider-contract + spider-codegen),
# passed via `secrets: inherit`; the run fails without it.
on:
  # Manual kick — no inputs; the shared workflow resolves the next version from the marker + tags itself.
  workflow_dispatch:
  # Nightly timed pull — the sole automated trigger; sync is pull-only (enumerates the contract
  # repo's released v<x.y> tags), nothing pushes to this repo.
  schedule:
    - cron: "0 6 * * *"
  # Auto-chain: a merged sync PR bumps version.properties; that push syncs the next version.
  push:
    branches: [main]
    paths: ["version.properties"]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    uses: tiducto/.github/.github/workflows/generate-contract.yml@main
    with:
      add-paths: |
        lib/src/contract
        version.properties
    secrets: inherit
